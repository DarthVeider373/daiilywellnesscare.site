<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 30" width="210" height="30">
  <!-- VISA -->
  <rect x="0" y="0" width="48" height="30" rx="4" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="24" y="20" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="800" font-size="13" fill="#1A1F71" text-anchor="middle">VISA</text>

  <!-- Mastercard -->
  <rect x="54" y="0" width="48" height="30" rx="4" fill="#ffffff" stroke="#d9d9d9"/>
  <circle cx="72" cy="15" r="8.5" fill="#EB001B"/>
  <circle cx="86" cy="15" r="8.5" fill="#F79E1B" style="mix-blend-mode:multiply"/>

  <!-- Amex -->
  <rect x="108" y="0" width="48" height="30" rx="4" fill="#1F72CD"/>
  <text x="132" y="19" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">AMEX</text>

  <!-- Discover -->
  <rect x="162" y="0" width="48" height="30" rx="4" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="186" y="18.5" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="7" fill="#FF6000" text-anchor="middle">DISCOVER</text>
</svg>
